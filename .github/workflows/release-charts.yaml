name: Release Charts

on:
  workflow_dispatch:
    inputs:
        version_tag:
          description: 'The target version tag for the release (e.g., 1.2.3, v1.2.3)'
          required: true
          type: string
permissions: {}
jobs:
  version-check:
    permissions: 
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Validate chart version
        run: |
          CHART_VERSION=$(grep '^version:' netra-helm-chart/Chart.yaml | awk '{print $2}')
          INPUT_VERSION="${{ inputs.version_tag }}"
          INPUT_VERSION="${INPUT_VERSION#v}"

          echo "Chart version: $CHART_VERSION"
          echo "Release version: $INPUT_VERSION"

          if [ "$CHART_VERSION" != "$INPUT_VERSION" ]; then
            echo "Version mismatch in netra-helm-chart/Chart.yaml!"
            echo "Expected version: $INPUT_VERSION"
            echo "Actual chart version: $CHART_VERSION"
            exit 1
          fi

          echo "Versions match!"
          
      - name: Check release version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.version_tag }}"
          VERSION="${VERSION#v}"

          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "Release $VERSION already exists!"
            exit 1
          fi

  release:
    needs: version-check
    permissions:
        contents: write
    runs-on: ubuntu-latest
    env:
      QUAY_REGISTRY: oci://quay.io/testorgkv/
    steps:

      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
            
      - name: Setup Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2
        with:
          version: v3.22.0
 
      - name: Package Helm chart
        run: |
          cd netra-helm-chart
          helm dependency build
          helm package .
          echo "Helm chart packaged successfully"
      
      - name: Login to Quay
        run: |
          echo "${{ secrets.QUAY_PASSWORD }}" | \
            helm registry login quay.io \
            --username "${{ secrets.QUAY_USERNAME }}" \
            --password-stdin

      - name: Push Helm chart to Quay
        run: |
          CHART=$(ls netra-helm-chart/*.tgz)
          echo "Pushing chart: $CHART"
          helm push "$CHART" "$QUAY_REGISTRY"
          echo "Helm chart pushed to Quay successfully"
      
      - name: Create GitHub Release
        run: |
          VERSION="${{ inputs.version_tag }}"
          VERSION="${VERSION#v}"
          PREVIOUS_VERSION=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)

          if [ -n "$PREVIOUS_VERSION" ]; then
            echo "Previous release: $PREVIOUS_VERSION"
            NOTES=$(git log "$PREVIOUS_VERSION"..HEAD \
              --pretty=format:"- %s (%h)" \
              -- netra-helm-chart/)

          else
            echo "No previous release found"

            NOTES=$(git log \
              --pretty=format:"- %s (%h)" \
              -- netra-helm-chart/)
          fi

          if [ -z "$NOTES" ]; then
            NOTES="No changes to netra-helm-chart since the previous release."
          fi

          NOTES="## Release Notes

          $NOTES"

          gh release create "$VERSION" \
            netra-helm-chart/*.tgz \
            --title "Netra Helm Chart $VERSION" \
            --notes "$NOTES"

          echo "Release $VERSION is available."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
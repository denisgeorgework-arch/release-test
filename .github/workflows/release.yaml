name: Release Charts

on:
  workflow_dispatch:
    inputs:
        version_tag:
          description: 'The target version tag for the release (e.g., v1.2.3)'
          required: true
          type: string

jobs:
  release:
    permissions:
        contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
            
      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.22.0
 
      - name: Package Helm chart
        run: |
          cd charts/hello-world
          helm package .
          echo "Helm chart packaged successfully"
      
      - name: Create local git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ inputs.version_tag }}" -m "Release ${{ inputs.version_tag }}"

      - name: Create GitHub Release
        run: |
          gh release create "${{ inputs.version_tag }}" \
            --generate-notes \
            --title "${{ inputs.version_tag }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}